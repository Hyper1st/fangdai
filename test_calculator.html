<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>房贷计算器逻辑验证</title>
    <script>
    // 等额本息计算公式验证
    function test_debx(amount, rate, months) {
        // 月利率
        const monthlyRate = rate / 12 / 100;
        // 月供公式: P * r * (1+r)^n / [(1+r)^n - 1]
        const monthlyPayment = amount * monthlyRate * Math.pow(1 + monthlyRate, months) /
                              (Math.pow(1 + monthlyRate, months) - 1);
        // 总利息 = 总还款 - 本金
        const totalRepayment = monthlyPayment * months;
        const totalInterest = totalRepayment - amount;

        return {
            monthlyPayment: Math.round(monthlyPayment * 100) / 100,
            totalInterest: Math.round(totalInterest * 100) / 100,
            totalRepayment: Math.round(totalRepayment * 100) / 100
        };
    }

    // 等额本金计算公式验证
    function test_debj(amount, rate, months) {
        // 月利率
        const monthlyRate = rate / 12 / 100;
        // 每月应还本金 = 贷款总额 / 还款月数
        const monthlyPrincipal = amount / months;
        // 首月月供 = 每月应还本金 + (贷款总额 × 月利率)
        const firstMonthPayment = monthlyPrincipal + amount * monthlyRate;
        // 总利息 = [（总贷款额÷还款月数+总贷款额×月利率）+总贷款额÷还款月数×(1+月利率)]÷2×还款月数-总贷款额
        // 简化公式：总利息 = 本金 × 月利率 × (还款月数 + 1) ÷ 2
        const totalInterest = amount * monthlyRate * (months + 1) / 2;
        const totalRepayment = amount + totalInterest;

        return {
            firstMonthPayment: Math.round(firstMonthPayment * 100) / 100,
            totalInterest: Math.round(totalInterest * 100) / 100,
            totalRepayment: Math.round(totalRepayment * 100) / 100,
            monthlyPrincipal: Math.round(monthlyPrincipal * 100) / 100
        };
    }

    // 测试场景
    function runTests() {
        const tests = [
            // 场景1: 商业贷款，100万，4.2%，20年（240期）
            {
                name: "商业贷款-100万-4.2%-20年",
                amount: 1000000,
                rate: 4.2,
                months: 240,
                type: "commercial"
            },
            // 场景2: 公积金贷款，80万，3.25%，30年（360期）
            {
                name: "公积金贷款-80万-3.25%-30年",
                amount: 800000,
                rate: 3.25,
                months: 360,
                type: "provident"
            },
            // 场景3: 小额贷款，10万，5.0%，5年（60期）
            {
                name: "小额贷款-10万-5%-5年",
                amount: 100000,
                rate: 5.0,
                months: 60,
                type: "small"
            },
            // 场景4: 极短期限，50万，6.0%，1年（12期）
            {
                name: "极短期限-50万-6%-1年",
                amount: 500000,
                rate: 6.0,
                months: 12,
                type: "short"
            },
            // 场景5: 大额贷款，500万，4.5%，25年（300期）
            {
                name: "大额贷款-500万-4.5%-25年",
                amount: 5000000,
                rate: 4.5,
                months: 300,
                type: "large"
            }
        ];

        let output = "<h2>房贷计算器逻辑验证结果</h2>";

        tests.forEach(test => {
            const debx = test_debx(test.amount, test.rate, test.months);
            const debj = test_debj(test.amount, test.rate, test.months);

            output += `
            <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                <h3>${test.name}</h3>
                <p>贷款金额: ${test.amount.toLocaleString('zh-CN')} 元, 年利率: ${test.rate}%, 期数: ${test.months}个月</p>

                <h4>等额本息计算结果:</h4>
                <ul>
                    <li>月供: ${debx.monthlyPayment.toLocaleString('zh-CN')} 元</li>
                    <li>总利息: ${debx.totalInterest.toLocaleString('zh-CN')} 元</li>
                    <li>总还款额: ${debx.totalRepayment.toLocaleString('zh-CN')} 元</li>
                </ul>

                <h4>等额本金计算结果:</h4>
                <ul>
                    <li>首月月供: ${debj.firstMonthPayment.toLocaleString('zh-CN')} 元</li>
                    <li>每月本金: ${debj.monthlyPrincipal.toLocaleString('zh-CN')} 元</li>
                    <li>总利息: ${debj.totalInterest.toLocaleString('zh-CN')} 元</li>
                    <li>总还款额: ${debj.totalRepayment.toLocaleString('zh-CN')} 元</li>
                </ul>

                <h4>合理性检查:</h4>
                <ul>
                    <li>总还款额 &gt; 贷款金额: ${debx.totalRepayment > test.amount ? "✓" : "✗"}</li>
                    <li>等额本金总利息 &lt; 等额本息总利息: ${debj.totalInterest < debx.totalInterest ? "✓" : "✗"}</li>
                    <li>等额本金首月月供 &gt; 等额本息月供: ${debj.firstMonthPayment > debx.monthlyPayment ? "✓" : "✗"}</li>
                    <li>月供 &gt; 每月本金: ${debx.monthlyPayment > test.amount/test.months ? "✓" : "✗"}</li>
                </ul>
            </div>
            `;
        });

        // 边界情况测试
        output += "<h3>边界情况测试</h3>";

        // 测试1: 0利率（应无利息）
        const zeroRate = test_debx(1000000, 0, 240);
        output += `<p>0利率测试: 月供=${zeroRate.monthlyPayment.toLocaleString('zh-CN')}, 总利息=${zeroRate.totalInterest} (应为0: ${zeroRate.totalInterest === 0 ? "✓" : "✗"})</p>`;

        // 测试2: 极小金额
        const smallAmount = test_debx(1, 4.2, 12);
        output += `<p>极小金额(1元): 月供=${smallAmount.monthlyPayment}, 总利息=${smallAmount.totalInterest}</p>`;

        // 测试3: 极短期（1个月）
        const oneMonth = test_debx(1000000, 4.2, 1);
        output += `<p>1个月贷款: 月供=${oneMonth.monthlyPayment.toLocaleString('zh-CN')}, 总利息=${oneMonth.totalInterest.toLocaleString('zh-CN')}</p>`;

        // 测试4: 高利率测试
        const highRate = test_debx(1000000, 20, 240);
        output += `<p>高利率(20%): 月供=${highRate.monthlyPayment.toLocaleString('zh-CN')}, 总利息=${highRate.totalInterest.toLocaleString('zh-CN')}</p>`;

        document.getElementById("results").innerHTML = output;
    }

    // 与新计算器逻辑对比
    function compareWithNewCalculator() {
        const amount = 1000000;
        const rate = 4.2;
        const months = 240;

        // 新计算器逻辑（从app.js提取）
        const monthlyRate = rate / 100 / 12;
        const monthlyPayment = amount * monthlyRate * Math.pow(1 + monthlyRate, months) /
                              (Math.pow(1 + monthlyRate, months) - 1);
        const totalRepay = monthlyPayment * months;
        const interest = totalRepay - amount;

        const newResult = {
            monthlyPayment: Math.round(monthlyPayment * 100) / 100,
            totalInterest: Math.round(interest * 100) / 100,
            totalRepayment: Math.round(totalRepay * 100) / 100
        };

        const myResult = test_debx(amount, rate, months);

        let output = "<h3>与新计算器逻辑对比</h3>";
        output += `<p>贷款金额: ${amount.toLocaleString('zh-CN')} 元, 利率: ${rate}%, 期数: ${months}个月</p>`;
        output += `<p>我的计算结果: 月供=${myResult.monthlyPayment.toLocaleString('zh-CN')}, 总利息=${myResult.totalInterest.toLocaleString('zh-CN')}</p>`;
        output += `<p>新计算器结果: 月供=${newResult.monthlyPayment.toLocaleString('zh-CN')}, 总利息=${newResult.totalInterest.toLocaleString('zh-CN')}</p>`;

        const match = Math.abs(myResult.monthlyPayment - newResult.monthlyPayment) < 0.01 &&
                      Math.abs(myResult.totalInterest - newResult.totalInterest) < 0.01;

        output += `<p>结果匹配: ${match ? "✓" : "✗"}</p>`;

        document.getElementById("comparison").innerHTML = output;
    }

    window.onload = function() {
        runTests();
        compareWithNewCalculator();
    };
    </script>
</head>
<body>
    <h1>房贷计算器逻辑验证</h1>
    <div id="results"></div>
    <div id="comparison"></div>
</body>
</html>
