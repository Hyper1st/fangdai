<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>房贷计算器边界情况测试</title>
    <script>
    // 复制app.js中的计算逻辑进行测试
    function testAppLogic() {
        console.log("=== app.js计算逻辑测试 ===");

        // 测试等额本息
        function calculateDebx(amount, rate, months) {
            const monthlyRate = rate / 100 / 12;
            if (monthlyRate === 0) {
                // 0利率特殊情况
                return {
                    monthlyPayment: amount / months,
                    totalInterest: 0,
                    totalRepayment: amount
                };
            }

            const monthly = amount * monthlyRate * Math.pow(1 + monthlyRate, months) /
                           (Math.pow(1 + monthlyRate, months) - 1);
            const totalRepay = monthly * months;
            const interest = totalRepay - amount;

            return {
                monthlyPayment: Math.round(monthly * 100) / 100,
                totalInterest: Math.round(interest * 100) / 100,
                totalRepayment: Math.round(totalRepay * 100) / 100
            };
        }

        // 测试等额本金
        function calculateDebj(amount, rate, months) {
            const monthlyRate = rate / 100 / 12;
            const monthlyPrincipal = amount / months;
            let totalInterest = 0;

            if (monthlyRate === 0) {
                totalInterest = 0;
            } else {
                // 使用公式计算总利息，避免循环误差
                totalInterest = amount * monthlyRate * (months + 1) / 2;
            }

            const firstMonthPayment = monthlyPrincipal + amount * monthlyRate;

            return {
                firstMonthPayment: Math.round(firstMonthPayment * 100) / 100,
                totalInterest: Math.round(totalInterest * 100) / 100,
                totalRepayment: Math.round((amount + totalInterest) * 100) / 100,
                monthlyPrincipal: Math.round(monthlyPrincipal * 100) / 100
            };
        }

        // 测试场景
        const tests = [
            { name: "正常情况-100万-4.2%-20年", amount: 1000000, rate: 4.2, months: 240 },
            { name: "0利率", amount: 1000000, rate: 0, months: 240 },
            { name: "极小金额1元", amount: 1, rate: 4.2, months: 12 },
            { name: "0金额", amount: 0, rate: 4.2, months: 240 },
            { name: "负利率(应处理)", amount: 1000000, rate: -1, months: 240 },
            { name: "1个月期限", amount: 1000000, rate: 4.2, months: 1 },
            { name: "0个月期限(边界)", amount: 1000000, rate: 4.2, months: 0 },
            { name: "高利率20%", amount: 1000000, rate: 20, months: 240 },
            { name: "极长期限360个月", amount: 1000000, rate: 4.2, months: 360 },
            { name: "浮点数利率4.12345%", amount: 1000000, rate: 4.12345, months: 240 }
        ];

        tests.forEach(test => {
            console.log(`\n测试: ${test.name}`);
            console.log(`参数: ${test.amount}元, ${test.rate}%, ${test.months}个月`);

            if (test.rate < 0) {
                console.log("负利率 - 应用层应拒绝");
                return;
            }

            if (test.months <= 0) {
                console.log("期限为0或负数 - 应用层应拒绝");
                return;
            }

            try {
                const debx = calculateDebx(test.amount, test.rate, test.months);
                const debj = calculateDebj(test.amount, test.rate, test.months);

                console.log("等额本息:", debx);
                console.log("等额本金:", debj);

                // 合理性检查
                if (debx.totalInterest < 0) console.warn("⚠ 等额本息总利息为负");
                if (debj.totalInterest < 0) console.warn("⚠ 等额本金总利息为负");
                if (debx.monthlyPayment < debj.monthlyPrincipal) console.warn("⚠ 等额本息月供小于每月本金");

            } catch (e) {
                console.error(`计算错误: ${e.message}`);
            }
        });
    }

    // 测试原始计算器逻辑
    function testOriginalLogic() {
        console.log("\n\n=== 原始计算器逻辑测试 ===");

        // 复制houseloan_calculator.js中的calculate_debx_singleLoan逻辑
        function calculate_debx_singleLoan(a, b, loanPeriods) {
            // a: 贷款金额, b: 月利率
            var j = a * loanPeriods * b * Math.pow(1 + b, loanPeriods) / (Math.pow(1 + b, loanPeriods) - 1) - a;
            j = Math.round(100 * j) / 100;
            var d = Math.round(100 * (j + a)) / 100;
            var f = d / loanPeriods;
            f = Math.round(100 * f) / 100;

            return {
                totalInterest: j,
                totalRepayment: d,
                monthlyPayment: f
            };
        }

        // 测试相同场景
        const amount = 1000000;
        const annualRate = 4.2;
        const months = 240;
        const monthlyRate = annualRate / 100 / 12;

        console.log(`测试参数: ${amount}元, ${annualRate}%, ${months}个月`);

        try {
            const result = calculate_debx_singleLoan(amount, monthlyRate, months);
            console.log("原始计算器结果:", result);

            // 与app.js结果对比
            const appResult = calculateDebx(amount, annualRate, months);
            console.log("app.js结果:", appResult);

            const diffMonthly = Math.abs(result.monthlyPayment - appResult.monthlyPayment);
            const diffInterest = Math.abs(result.totalInterest - appResult.totalInterest);

            console.log(`月供差异: ${diffMonthly}, 总利息差异: ${diffInterest}`);

            if (diffMonthly > 0.01 || diffInterest > 0.01) {
                console.warn("⚠ 两个计算器结果不一致");
            }

        } catch (e) {
            console.error(`原始计算器错误: ${e.message}`);
        }
    }

    // 测试输入验证逻辑
    function testValidation() {
        console.log("\n\n=== 输入验证测试 ===");

        // app.js验证逻辑
        function validateInputsApp(loanType, businessAmount, businessRate, pafAmount, pafRate, loanYears) {
            let isValid = true;
            let errors = [];

            // 商业贷款验证
            if (loanType === 0 || loanType === 2) {
                if (isNaN(businessAmount) || businessAmount <= 0 || businessAmount > 10000) {
                    isValid = false;
                    errors.push('商业贷款金额需在1-10000万元之间');
                }

                if (isNaN(businessRate) || businessRate <= 0 || businessRate > 20) {
                    isValid = false;
                    errors.push('商业贷款利率需在0.01-20%之间');
                }
            }

            // 公积金贷款验证
            if (loanType === 1 || loanType === 2) {
                if (isNaN(pafAmount) || pafAmount <= 0 || pafAmount > 10000) {
                    isValid = false;
                    errors.push('公积金贷款金额需在1-10000万元之间');
                }

                if (isNaN(pafRate) || pafRate <= 0 || pafRate > 10) {
                    isValid = false;
                    errors.push('公积金贷款利率需在0.01-10%之间');
                }
            }

            // 贷款年限验证
            if (isNaN(loanYears) || loanYears < 1 || loanYears > 30) {
                isValid = false;
                errors.push('贷款年限需在1-30年之间');
            }

            return { isValid, errors };
        }

        // 原始计算器验证逻辑
        function validateInputsOriginal(input) {
            const regex = /^\d*[\.]?\d*$/;
            return input !== "" && regex.test(input);
        }

        // 测试用例
        const validationTests = [
            { type: "商业贷款", businessAmount: 100, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 20, expected: true },
            { type: "金额为0", businessAmount: 0, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false },
            { type: "金额负数", businessAmount: -100, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false },
            { type: "利率为0", businessAmount: 100, businessRate: 0, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false },
            { type: "利率负数", businessAmount: 100, businessRate: -1, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false },
            { type: "超大金额", businessAmount: 20000, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false },
            { type: "超长期限", businessAmount: 100, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 31, expected: false },
            { type: "期限为0", businessAmount: 100, businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 0, expected: false },
            { type: "组合贷款正常", businessAmount: 100, businessRate: 4.2, pafAmount: 80, pafRate: 3.25, loanYears: 20, expected: true },
            { type: "空字符串", businessAmount: "", businessRate: 4.2, pafAmount: 0, pafRate: 0, loanYears: 20, expected: false }
        ];

        validationTests.forEach(test => {
            const result = validateInputsApp(0, test.businessAmount, test.businessRate, test.pafAmount, test.pafRate, test.loanYears);
            const pass = result.isValid === test.expected;

            console.log(`${test.type}: ${pass ? "✓" : "✗"} (期望: ${test.expected}, 实际: ${result.isValid})`);
            if (!pass) {
                console.log(`  错误信息: ${result.errors.join(", ")}`);
            }
        });
    }

    // 运行所有测试
    window.onload = function() {
        testAppLogic();
        testOriginalLogic();
        testValidation();

        console.log("\n=== 测试完成 ===");
        document.getElementById("status").innerHTML = "测试完成，请查看浏览器控制台 (F12)";
    };
    </script>
</head>
<body>
    <h1>房贷计算器边界情况测试</h1>
    <div id="status">运行测试中...</div>
    <div style="margin-top: 20px;">
        <h3>测试说明：</h3>
        <ul>
            <li>打开浏览器开发者工具 (F12) 查看控制台输出</li>
            <li>测试包括：正常情况、0利率、0金额、负值、边界值等</li>
            <li>对比新计算器(app.js)和原始计算器(houseloan_calculator.js)逻辑</li>
            <li>检查输入验证逻辑是否合理</li>
        </ul>
    </div>
</body>
</html>
